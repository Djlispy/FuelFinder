<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Price Locator</title>
    <link rel="stylesheet" href="static/css/styles.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    <!-- <script src="https://unpkg.com/leaflet@latest/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-providers@latest/leaflet-providers.js"></script> -->

</head>
<body>

    <main>

<div id="fuel-selector" class="fuel-buttons-grid">
  <button data-fuel="regular_price">
    <img src="https://www.7-eleven.com/assets/img/store-locator/fuel.svg" alt="Gas" width="16" height="16" />
    Regular
  </button>

  <button data-fuel="premium_price">
    <img src="https://www.7-eleven.com/assets/img/store-locator/fuel.svg" alt="Gas" width="16" height="16" />
    Premium
  </button>

  <button data-fuel="mid_grade_price">
    <img src="https://www.7-eleven.com/assets/img/store-locator/fuel.svg" alt="Gas" width="16" height="16" />
    Mid-Grade
  </button>

  <button data-fuel="diesel_price">
    <img src="https://www.7-eleven.com/assets/img/store-locator/fuel.svg" alt="Gas" width="16" height="16" />
    Diesel
  </button>
</div>




        <div class="container">
            <div id="map"></div>
            <!-- <div id="cheapest-station-info" class="station-bubble"></div> -->
            <div id="cheapest-regular" class="station-bubble"></div>
            <div id="cheapest-midgrade" class="station-bubble"></div>
            <div id="cheapest-premium" class="station-bubble"></div>
            <div id="cheapest-diesel" class="station-bubble"></div>
        </div>

    </main>


    <script type="module" src="static/scripts/markers.js"></script>

</body>
</html>

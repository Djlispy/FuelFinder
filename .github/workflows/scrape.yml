name: FuelFinder Full Workflow

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:

jobs:
  scrape-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb libxi6 libnss3 libxss1 fonts-liberation

      - name: Download and install Chrome (ignore errors)
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb
        continue-on-error: true

      - name: Fix missing dependencies (ignore errors)
        run: sudo apt-get install -f -y
        continue-on-error: true

      - name: Install ChromeDriver and Python packages
        run: |
          echo "Chrome version:"
          google-chrome --version

          FULL_VERSION=$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Full Chrome version: $FULL_VERSION"

          CHROME_VERSION=$(echo "$FULL_VERSION" | cut -d '.' -f1,2)
          echo "Using Chrome major.minor version: $CHROME_VERSION"

          CHROMEDRIVER_VERSION=$(wget -qO- https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION)
          echo "ChromeDriver version: $CHROMEDRIVER_VERSION"

          wget https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

          python -m pip install --upgrade pip
          pip install selenium pyvirtualdisplay pynacl requests


      - name: Run token scraper
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          xvfb-run --auto-servernum python TokenUpdater.py

  run-scraper:
    needs: scrape-token
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run python script
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          python docs/FuelFinderRequests.py

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github-actions@github.com'
          git add docs/locations.json docs/FuelFinder.log
          git commit -m "Update gas data JSON" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

name: AuthToken.py

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/AuthToken.py'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install undetected-chromedriver selenium

      - name: Run AuthToken.py
        run: |
          python docs/AuthToken.py
